services:
  swinglens:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=1
      - SECRET_KEY=${SECRET_KEY:-change-me-for-real-deployments}
      # Optional hosted AI:
      # - LLM_PROVIDER=gemini
      # - CLOUD_LLM_MODEL=gemini-2.0-flash
      # - CLOUD_LLM_API_KEY=your_provider_key
    volumes:
      - swinglens-data:/data
volumes:
  swinglens-data:
